name: Tradies2Quote
options:
  bundleIdPrefix: com.str8builders
  deploymentTarget:
    iOS: '17.0'
  xcodeVersion: '26.6'
settings:
  base:
    SWIFT_VERSION: '6.0'
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '1'
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    exactVersion: 2.55.2
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    exactVersion: 7.11.1
targets:
  Tradies2Quote:
    type: application
    platform: iOS
    sources: [Tradies2Quote]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.str8builders.tradies2quote
        INFOPLIST_FILE: Tradies2Quote/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Tradies2Quote/Resources/Tradies2Quote.entitlements
      configs:
        Debug:
          APNS_ENVIRONMENT: development
        Release:
          APNS_ENVIRONMENT: production
    dependencies:
      - package: Supabase
      - package: GRDB
  Tradies2QuoteTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tradies2QuoteTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Tradies2Quote
  Tradies2QuoteUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tradies2QuoteUITests
        excludes: [IntegrationCredentials.json]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Tradies2Quote
schemes:
  Tradies2Quote:
    build:
      targets:
        Tradies2Quote: all
    test:
      targets: [Tradies2QuoteTests, Tradies2QuoteUITests]
