<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Tradies2Quote — offline</title>
<style>
  /* Native offline screen for the iOS shell (Guideline 4.2 — reviewers
     Airplane-Mode-test; a stock WKWebView error page reads "wrapper").
     Brand cream canvas + ink type, matching the app splash. */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: #0A0A0A;
    color: #FFFFFF;
    font-family: -apple-system, "SF Pro Text", system-ui, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px calc(24px + env(safe-area-inset-right)) calc(32px + env(safe-area-inset-bottom)) calc(24px + env(safe-area-inset-left));
  }
  .card { max-width: 420px; text-align: center; }
  .mark {
    width: 72px; height: 72px; margin: 0 auto 24px;
    background: #FF5F15; border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
  }
  .mark svg { width: 40px; height: 40px; }
  h1 {
    font-size: 28px; line-height: 1.1; letter-spacing: -0.02em;
    text-transform: uppercase; font-weight: 800;
  }
  h1 span { color: #FF5F15; }
  p { margin-top: 12px; font-size: 16px; line-height: 1.5; color: #A3A39B; }
  button {
    margin-top: 28px; width: 100%; height: 52px;
    background: #FF5F15; color: #fff; border: 0; border-radius: 12px;
    font-size: 17px; font-weight: 700; font-family: inherit;
  }
  button:active { opacity: 0.85; }
  .status { margin-top: 14px; font-size: 13px; color: #8A8A8A; min-height: 18px; }
</style>
</head>
<body>
  <main class="card">
    <div class="mark" aria-hidden="true">
      <!-- measuring-tape glyph, inline so it works fully offline -->
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round">
        <rect x="3" y="7" width="18" height="10" rx="2"/>
        <path d="M7 7v3M11 7v5M15 7v3M19 7v5"/>
      </svg>
    </div>
    <h1>You're <span>offline.</span></h1>
    <p>Tradies2Quote needs an internet connection to load your quotes and
       clients. Check your signal or Wi-Fi and try again.</p>
    <button type="button" onclick="retry()">Try again</button>
    <div class="status" id="status" role="status"></div>
  </main>
  <script>
    function retry() {
      document.getElementById("status").textContent = "Reconnecting…";
      // The shell's start URL is the production origin; a plain reload
      // re-attempts it once the network is back.
      window.location.replace("https://tradies2quote.com/app");
    }
    // Auto-retry the moment iOS reports the network is back.
    window.addEventListener("online", retry);
  </script>
</body>
</html>
