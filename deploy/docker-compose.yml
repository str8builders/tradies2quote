# ---------------------------------------------------------------------------
# tradies2quote — app + reverse proxy overlay.
#
# This compose runs YOUR Next.js app and a Caddy reverse proxy (auto-HTTPS).
# It joins the network created by the OFFICIAL self-hosted Supabase stack
# (see deploy/README.md, step 3) so the app can reach Supabase's Kong gateway
# by service name.
#
# Bring up order:
#   1. Start the official Supabase stack  (creates network `supabase_default`)
#   2. docker compose -f deploy/docker-compose.yml --env-file deploy/.env.vps up -d --build
# ---------------------------------------------------------------------------

services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        # Public vars must be present at BUILD time (client-inlined).
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY}
        NEXT_PUBLIC_T2Q_WEATHER_IMPACT: ${NEXT_PUBLIC_T2Q_WEATHER_IMPACT:-}
        NEXT_PUBLIC_T2Q_WEATHER_PLANNING: ${NEXT_PUBLIC_T2Q_WEATHER_PLANNING:-}
    restart: unless-stopped
    env_file:
      - .env.vps            # server-only secrets injected at RUN time
    expose:
      - "3000"
    networks:
      - supabase
      - web
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - supabase       # so Caddy can also proxy the Supabase API (kong)
      - web

networks:
  # The network the official Supabase compose creates. If yours differs,
  # run `docker network ls` and set SUPABASE_NETWORK accordingly.
  supabase:
    external: true
    name: ${SUPABASE_NETWORK:-supabase_default}
  web:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
